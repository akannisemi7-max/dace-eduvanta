<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduVanta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--nav:#050506;--navtext:#b9bdc7;
  --bg:#f3f4f7;--card:#fff;--line:#e2e5eb;--text:#101218;--muted:#586070;
  --blue:#1d4fd7;--blue-soft:#e8eefc;--blue-ink:#1d4fd7;
  --gold:#c9a227;--gold-soft:#fbf4da;--gold-ink:#7a5b00;
  --ok:#0f7a58;--ok-soft:#e1f5ee;--warn:#9a5b00;--warn-soft:#fdf0d5;--bad:#b42318;--bad-soft:#fde8e6;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
[data-theme=dark]{
  --nav:#000;--bg:#090a0d;--card:#13151b;--line:#252932;--text:#eceef3;--muted:#98a0ae;
  --blue:#6c96ff;--blue-soft:#17223f;--blue-ink:#8fb0ff;
  --gold:#d9b44a;--gold-soft:#2a2410;--gold-ink:#e4c35e;
  --ok:#3ecb9d;--ok-soft:#0f2a22;--warn:#f0b34a;--warn-soft:#2c2108;--bad:#ff8b7e;--bad-soft:#3a1512;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600}
h1,h2,.serif{font-family:var(--serif);letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue-ink)}
.mut{color:var(--muted)}.sm{font-size:13px}.c{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.hide{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--navtext);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:18px 12px;border-right:1px solid #15171c}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:#fff;font:600 21px var(--serif)}
.schoolname{margin:0 8px 14px;padding:10px 12px;border:1px solid #23262d;border-radius:10px;font-size:13px;color:#fff}
.schoolname small{display:block;color:var(--navtext);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:var(--navtext);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;position:relative;font-weight:500}
.nav button:hover{background:#14161b;color:#fff}
.nav button.on{background:rgba(51,102,255,.2);color:#fff}
.nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .badge{margin-left:auto;background:var(--gold);color:#000;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .foot{margin-top:auto;padding:14px 8px 0;font-size:12px;color:#7c818d}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h2{font-size:22px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--blue)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#000;border-radius:99px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.menu{display:none}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--nav);color:var(--gold);display:grid;place-items:center;font:600 14px var(--serif);border:1px solid var(--gold)}
.page{padding:24px;max-width:1280px;width:100%;margin:0 auto}
.phead{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:30px;line-height:1.15}
.phead p{margin:4px 0 0;color:var(--muted)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card>header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.card>header h3{font-size:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .sl{color:var(--muted);font-size:13px}
.stat .sv{font:600 30px/1.2 var(--serif);margin-top:2px}
.stat .ss{font-size:12px;color:var(--muted)}
.stat.gold{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.clock{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--nav);color:#fff;border-color:#1b1e25}
.clock .mut{color:#9aa1ae}
.bigtime{font:600 54px/1.1 var(--serif);color:#fff;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.bigtime sup{font-size:20px;color:var(--gold)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--text);margin-bottom:4px}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.btn.gold:hover{filter:brightness(1.07)}
.btn.dark{background:#fff;border-color:#fff;color:#000}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:14px 28px;font-size:17px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
label.f .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],input[type=datetime-local],input[type=month],select,textarea{width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:400}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.fgrid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.check{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;margin:4px 0}
.check input{width:auto;margin:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item.unread .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px}

/* charts */
.chart{width:100%;height:auto;display:block}
.ct{font-size:9.5px;fill:var(--muted)}.cv{font-size:9.5px;fill:var(--text);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.gold>i{background:var(--gold)}

/* timetable */
.ttg{display:grid;grid-template-columns:78px repeat(5,minmax(112px,1fr));gap:6px;min-width:700px}
.ttg .h{font-weight:600;font-size:13px;color:var(--muted);padding:4px}
.ttg .h.today{color:var(--gold-ink)}
.ttg .p{font-size:12px;color:var(--muted);padding:6px 4px}
.cell{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px;min-height:56px;background:var(--card)}
.cell b{display:block;font-size:13px}
.cell.has{background:var(--blue-soft);border-color:transparent}
.cell.has.today{box-shadow:inset 3px 0 0 var(--gold)}
.cell.brk{grid-column:1/-1;min-height:0;text-align:center;color:var(--muted);background:var(--bg);border-style:dashed;padding:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:520px}
.cal div{border:1px solid var(--line);border-radius:8px;min-height:62px;padding:5px 7px;font-size:12px}
.cal .dh{border:0;min-height:0;color:var(--muted);font-weight:600}
.cal .on{background:var(--blue-soft);border-color:transparent}.cal .tdy{box-shadow:inset 0 0 0 2px var(--gold)}

/* overlay */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:100}
#modal.on{display:flex}
.dlg{background:var(--card);border-radius:16px;width:100%;max-width:560px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.45);border:1px solid var(--line)}
.dlg.wide{max-width:820px}
.dlg h3{font:600 22px var(--serif);margin-bottom:14px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;width:calc(100% - 28px);pointer-events:none}
.toast{background:#000;color:#fff;border-left:4px solid var(--gold);padding:11px 16px;border-radius:10px;font-size:14px;max-width:520px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.bad{border-color:#ff6b5e}.toast.ok{border-color:#3ecb9d}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lhero{background:#000;color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lhero::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border:1px solid rgba(201,162,39,.35);border-radius:50%;box-shadow:0 0 0 40px rgba(201,162,39,.05),0 0 0 90px rgba(29,79,215,.07)}
.lhero h1{font-size:46px;line-height:1.08;max-width:520px;margin:0 0 16px}
.lhero p{color:#aab0bc;max-width:460px;font-size:16px}
.lpoints{display:grid;gap:10px;color:#cfd3dc;font-size:14px;position:relative;z-index:1}
.lpoints div{padding-left:16px;border-left:2px solid var(--gold)}
.lform{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.lbox{width:100%;max-width:400px}
.lbox h2{font-size:28px;margin-bottom:4px}
.demo{display:grid;gap:8px;margin-top:20px}
.demo button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.demo button:hover{border-color:var(--gold)}
.demo small{color:var(--muted)}

input.mk{width:84px;margin:0;padding:6px 8px}
.optbtn{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:16px}
.optbtn b{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none;font-size:13px}
.optbtn:hover{border-color:var(--blue)}
.optbtn.sel{border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.optbtn.sel b{background:var(--gold);color:#000}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}
.qn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.qn.done{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink)}
.qn.cur{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
@media(max-width:900px){
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:274px;z-index:60;transform:translateX(-102%);transition:transform .22s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .menu{display:grid}
  .top{padding:10px 14px}.top h2{font-size:18px}
  .page{padding:16px 14px}
  .phead h1{font-size:25px}
  .login{grid-template-columns:1fr}.lhero{padding:28px 22px;min-height:0}.lhero h1{font-size:32px}.lpoints{display:none}
  .bigtime{font-size:44px}
  .hm{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,.top,.acts,.btn,#toast{display:none!important}.shell{display:block}.card{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" aria-live="polite"></div>
<script>
