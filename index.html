<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduVanta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--nav:#050506;--navtext:#b9bdc7;
  --bg:#f3f4f7;--card:#fff;--line:#e2e5eb;--text:#101218;--muted:#586070;
  --blue:#1d4fd7;--blue-soft:#e8eefc;--blue-ink:#1d4fd7;
  --gold:#c9a227;--gold-soft:#fbf4da;--gold-ink:#7a5b00;
  --ok:#0f7a58;--ok-soft:#e1f5ee;--warn:#9a5b00;--warn-soft:#fdf0d5;--bad:#b42318;--bad-soft:#fde8e6;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
[data-theme=dark]{
  --nav:#000;--bg:#090a0d;--card:#13151b;--line:#252932;--text:#eceef3;--muted:#98a0ae;
  --blue:#6c96ff;--blue-soft:#17223f;--blue-ink:#8fb0ff;
  --gold:#d9b44a;--gold-soft:#2a2410;--gold-ink:#e4c35e;
  --ok:#3ecb9d;--ok-soft:#0f2a22;--warn:#f0b34a;--warn-soft:#2c2108;--bad:#ff8b7e;--bad-soft:#3a1512;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600}
h1,h2,.serif{font-family:var(--serif);letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue-ink)}
.mut{color:var(--muted)}.sm{font-size:13px}.c{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.hide{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--navtext);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:18px 12px;border-right:1px solid #15171c}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:#fff;font:600 21px var(--serif)}
.schoolname{margin:0 8px 14px;padding:10px 12px;border:1px solid #23262d;border-radius:10px;font-size:13px;color:#fff}
.schoolname small{display:block;color:var(--navtext);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:var(--navtext);padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;position:relative;font-weight:500}
.nav button:hover{background:#14161b;color:#fff}
.nav button.on{background:rgba(51,102,255,.2);color:#fff}
.nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .badge{margin-left:auto;background:var(--gold);color:#000;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .foot{margin-top:auto;padding:14px 8px 0;font-size:12px;color:#7c818d}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h2{font-size:22px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--blue)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#000;border-radius:99px;font-size:10px;font-weight:700;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.menu{display:none}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--nav);color:var(--gold);display:grid;place-items:center;font:600 14px var(--serif);border:1px solid var(--gold)}
.page{padding:24px;max-width:1280px;width:100%;margin:0 auto}
.phead{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:30px;line-height:1.15}
.phead p{margin:4px 0 0;color:var(--muted)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card>header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.card>header h3{font-size:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .sl{color:var(--muted);font-size:13px}
.stat .sv{font:600 30px/1.2 var(--serif);margin-top:2px}
.stat .ss{font-size:12px;color:var(--muted)}
.stat.gold{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.clock{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--nav);color:#fff;border-color:#1b1e25}
.clock .mut{color:#9aa1ae}
.bigtime{font:600 54px/1.1 var(--serif);color:#fff;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.bigtime sup{font-size:20px;color:var(--gold)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--text);margin-bottom:4px}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.btn.gold:hover{filter:brightness(1.07)}
.btn.dark{background:#fff;border-color:#fff;color:#000}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:14px 28px;font-size:17px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--gold)}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
label.f .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],input[type=datetime-local],input[type=month],select,textarea{width:100%;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-weight:400}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.fgrid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.check{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;margin:4px 0}
.check input{width:auto;margin:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item.unread .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px}

/* charts */
.chart{width:100%;height:auto;display:block}
.ct{font-size:9.5px;fill:var(--muted)}.cv{font-size:9.5px;fill:var(--text);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.gold>i{background:var(--gold)}

/* timetable */
.ttg{display:grid;grid-template-columns:78px repeat(5,minmax(112px,1fr));gap:6px;min-width:700px}
.ttg .h{font-weight:600;font-size:13px;color:var(--muted);padding:4px}
.ttg .h.today{color:var(--gold-ink)}
.ttg .p{font-size:12px;color:var(--muted);padding:6px 4px}
.cell{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px;min-height:56px;background:var(--card)}
.cell b{display:block;font-size:13px}
.cell.has{background:var(--blue-soft);border-color:transparent}
.cell.has.today{box-shadow:inset 3px 0 0 var(--gold)}
.cell.brk{grid-column:1/-1;min-height:0;text-align:center;color:var(--muted);background:var(--bg);border-style:dashed;padding:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:520px}
.cal div{border:1px solid var(--line);border-radius:8px;min-height:62px;padding:5px 7px;font-size:12px}
.cal .dh{border:0;min-height:0;color:var(--muted);font-weight:600}
.cal .on{background:var(--blue-soft);border-color:transparent}.cal .tdy{box-shadow:inset 0 0 0 2px var(--gold)}

/* overlay */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:100}
#modal.on{display:flex}
.dlg{background:var(--card);border-radius:16px;width:100%;max-width:560px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.45);border:1px solid var(--line)}
.dlg.wide{max-width:820px}
.dlg h3{font:600 22px var(--serif);margin-bottom:14px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;width:calc(100% - 28px);pointer-events:none}
.toast{background:#000;color:#fff;border-left:4px solid var(--gold);padding:11px 16px;border-radius:10px;font-size:14px;max-width:520px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.bad{border-color:#ff6b5e}.toast.ok{border-color:#3ecb9d}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lhero{background:#000;color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lhero::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border:1px solid rgba(201,162,39,.35);border-radius:50%;box-shadow:0 0 0 40px rgba(201,162,39,.05),0 0 0 90px rgba(29,79,215,.07)}
.lhero h1{font-size:46px;line-height:1.08;max-width:520px;margin:0 0 16px}
.lhero p{color:#aab0bc;max-width:460px;font-size:16px}
.lpoints{display:grid;gap:10px;color:#cfd3dc;font-size:14px;position:relative;z-index:1}
.lpoints div{padding-left:16px;border-left:2px solid var(--gold)}
.lform{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.lbox{width:100%;max-width:400px}
.lbox h2{font-size:28px;margin-bottom:4px}
.demo{display:grid;gap:8px;margin-top:20px}
.demo button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.demo button:hover{border-color:var(--gold)}
.demo small{color:var(--muted)}

input.mk{width:84px;margin:0;padding:6px 8px}
.optbtn{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font-size:16px}
.optbtn b{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none;font-size:13px}
.optbtn:hover{border-color:var(--blue)}
.optbtn.sel{border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.optbtn.sel b{background:var(--gold);color:#000}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}
.qn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.qn.done{background:var(--blue-soft);border-color:transparent;color:var(--blue-ink)}
.qn.cur{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
@media(max-width:900px){
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:274px;z-index:60;transform:translateX(-102%);transition:transform .22s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  .menu{display:grid}
  .top{padding:10px 14px}.top h2{font-size:18px}
  .page{padding:16px 14px}
  .phead h1{font-size:25px}
  .login{grid-template-columns:1fr}.lhero{padding:28px 22px;min-height:0}.lhero h1{font-size:32px}.lpoints{display:none}
  .bigtime{font-size:44px}
  .hm{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,.top,.acts,.btn,#toast{display:none!important}.shell{display:block}.card{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>new Date(s+'T00:00:00');
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const toMin=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return h*60+m};
const fromMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const addMin=(t,m)=>fromMin(toMin(t)+m);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'');
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Mon','Tue','Wed','Thu','Fri'],DAYL=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const fmtD=s=>{if(!s)return '—';const d=parse(s);return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`};
const fmtDL=s=>{const d=parse(s);return `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`};
const fmtTs=t=>{const d=new Date(t);return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dow=s=>(parse(s).getDay()+6)%7;
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const bytes=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';
const pct=(a,b)=>b?Math.round(a/b*100):0;
const PERIODS=[{n:1,s:'08:00',e:'08:40'},{n:2,s:'08:40',e:'09:20'},{n:3,s:'09:20',e:'10:00'},{n:4,s:'10:30',e:'11:10'},{n:5,s:'11:10',e:'11:50'},{n:6,s:'11:50',e:'12:30'}];

/* The demo treats weekends as the previous Friday so there is always a school day to work with. */
const isWeekend=()=>[0,6].includes(new Date().getDay());
function workDate(){const d=new Date();if(d.getDay()===0)d.setDate(d.getDate()-2);if(d.getDay()===6)d.setDate(d.getDate()-1);return d}
const TODAY=()=>iso(workDate());
function weekdaysRange(from,to){const out=[];let d=from;while(d<=to){if(dow(d)<5)out.push(d);d=addDays(d,1)}return out}
function weekdaysBack(n,end=TODAY()){const out=[];let d=end;while(out.length<n){if(dow(d)<5)out.push(d);d=addDays(d,-1)}return out.reverse()}
const mondayOf=s=>addDays(s,-dow(s));

/* ============ seed ============ */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function scaffold(subject,cls,topic){return{
 objectives:`By the end of the lesson, students should be able to:\n1. State what ${topic} means in ${subject}.\n2. Explain the key ideas behind ${topic} using examples.\n3. Apply ${topic} to solve or discuss simple problems.`,
 prior:`Students already know the basic terms from earlier ${subject} lessons in ${cls}.`,
 materials:`Whiteboard and markers, charts, students' notebooks, textbook.`,
 references:`Approved ${cls} ${subject} textbook and the current scheme of work.`,
 intro:`Begin with short questions on previous knowledge, then link them to today's topic: ${topic}.`,
 content:`1. Meaning and definition of ${topic}.\n2. Main features or rules, each with a worked example.\n3. Common mistakes and how to avoid them.\n4. Examples from everyday Nigerian life to make the idea concrete.`,
 activities:`Teacher explains and demonstrates. Students answer oral questions, work in pairs on two examples and present one answer to the class.`,
 evaluation:`1. Define ${topic} in your own words.\n2. Give two examples.\n3. Work through one new example on the board.`,
 assignment:`Write short notes on ${topic} and complete the exercise given in class.`}}


function seedFresh(){
 const id='dace',db={v:3,session:null,theme:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light',
  schools:[{id,name:'D-Ace Ultimate Secondary School',city:'',code:'DAUSS',created:iso(new Date()),active:true,plan:'Free',settings:{resume:'08:00',close:'15:00',grace:5,geofence:false,lat:null,lng:null,radius:150,noteDay:4,aiEnabled:true}}],
  users:[],classes:[],subjects:[],sessions:[],slots:[],attendance:[],lessons:[],notes:[],notifs:[],audit:[],announce:[],folders:[],activity:[],comments:[],assessments:[],attempts:[],marks:[],sheets:[],flags:{},config:{free:true,storageCapMB:50,uploadMaxKB:700}};
 ['JSS1','JSS2','JSS3','SS1','SS2','SS3'].forEach(c=>db.classes.push({id:id+'_c_'+c,school:id,name:c}));
 ['English Language','Mathematics','Civic Education','Basic Science','Physics','Chemistry','Biology','Economics','Government','Literature-in-English','Agricultural Science','Computer Studies'].forEach(n=>db.subjects.push({id:id+'_s_'+slug(n),school:id,name:n}));
 db.sessions.push({id:id+'_ses_2627',school:id,name:'2026/2027',current:true,termIdx:0,terms:[{name:'First Term',start:'2026-09-14',end:'2026-12-18'},{name:'Second Term',start:'2027-01-11',end:'2027-04-02'},{name:'Third Term',start:'2027-04-26',end:'2027-07-16'}]});
 return db}
async function hp(p){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('eduvanta:'+p));return 'h:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return 'p:'+p}

/* ============ storage ============ */
let DB=null;const KEY='eduvanta:db:v3';let HAS_STORE=false,saveT=null;
let STORE_KIND='none';
const lsOK=()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}};
async function loadDB(){
 HAS_STORE=false;let raw=null;
 try{if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);STORE_KIND='cloud';HAS_STORE=true;if(r&&r.value)raw=r.value}}catch(e){}
 if(!raw&&lsOK()){if(STORE_KIND==='none'){STORE_KIND='local';HAS_STORE=true}try{raw=localStorage.getItem(KEY)||raw}catch(e){}}
 try{if(raw){const d=JSON.parse(raw);if(d.v===3){DB=d;['assessments','attempts','marks','sheets','comments'].forEach(k=>{DB[k]=DB[k]||[]});return}}}catch(e){}
 DB=seedFresh();
}
function persist(){clearTimeout(saveT);setPill('Saving…');saveT=setTimeout(async()=>{const js=JSON.stringify(DB);let ok=false,full=false;
 try{if(STORE_KIND==='cloud'){await window.storage.set(KEY,js);ok=true}}catch(e){}
 try{if(lsOK()){localStorage.setItem(KEY,js);ok=true}}catch(e){full=true}
 if(full&&!ok&&!S.warnFail){S.warnFail=1;toast("This browser's storage is full, so the latest changes are not saved. Download a backup now.",'bad')}
 else if(js.length>4.2e6&&!S.warnFull){S.warnFull=1;toast('Storage is nearly full. Download a backup now and plan to connect Supabase.','bad')}
 setPill(ok?'Saved':'Session only')},350)}

function instances(from,to,f={}){
 const today=TODAY(),now=nowHM(),LM=new Map(mine('lessons').filter(l=>l.slotId).map(l=>[l.slotId+'|'+l.date,l]));
 const slots=mine('slots').filter(s=>(!f.teacher||s.teacherId===f.teacher)&&(!f.cls||s.classId===f.cls)),out=[];
 for(const d of weekdaysRange(from,to)){const w=dow(d);
  for(const s of slots){if(s.day!==w)continue;const p=PERIODS[s.period-1],l=LM.get(s.id+'|'+d);let st;
   if(l)st=l.status==='completed'?'Completed':l.status==='active'?'In progress':'In classroom';
   else if(d<today||(d===today&&p.e<now))st='Missed';
   else if(d===today&&p.s<=now)st='Awaiting start';
   else st='Upcoming';
   out.push({date:d,slot:s,p,lesson:l,status:st})}}
 return out.sort((a,b)=>a.date.localeCompare(b.date)||a.p.s.localeCompare(b.p.s));
}
const attOn=(uid_,d)=>mine('attendance').find(a=>a.userId===uid_&&a.date===d);
const attToday=u=>attOn(u,TODAY());
function teacherStats(uid_,n=15){
 const ds=weekdaysBack(n),today=TODAY(),sc=school().settings,A=mine('attendance').filter(a=>a.userId===uid_);
 let pres=0,late=0,abs=0,early=0;
 ds.forEach(d=>{const a=A.find(x=>x.date===d);
  if(a){if(a.status==='absent')abs++;else{a.status==='late'?late++:pres++;if(a.early)early++}}
  else if(d<today||nowHM()>addMin(sc.resume,60))abs++});
 const inst=instances(ds[0],ds[ds.length-1],{teacher:uid_}).filter(i=>['Completed','In progress','In classroom','Missed'].includes(i.status));
 const done=inst.filter(i=>i.status==='Completed').length,missed=inst.filter(i=>i.status==='Missed').length;
 const ses=curSession(),tm=curTerm(),notes=mine('notes').filter(x=>x.teacherId===uid_&&x.sessionId===ses.id&&tm&&x.term===tm.name);
 const out=outstandingFor(uid_);
 return{pres,late,abs,early,days:pres+late+abs,attPct:pct(pres+late,pres+late+abs),punct:pct(pres,pres+late),sched:inst.length,done,missed,
  submitted:notes.filter(x=>x.status!=='draft').length,approved:notes.filter(x=>x.status==='approved').length,drafts:notes.filter(x=>x.status==='draft').length,outstanding:out.length,outList:out}
}
function pairsOf(uid_){return [...new Set(mine('slots').filter(s=>s.teacherId===uid_).map(s=>s.classId+'|'+s.subjectId))].map(p=>{const [classId,subjectId]=p.split('|');return{classId,subjectId}})}
function outstandingFor(uid_){const ses=curSession(),tm=curTerm(),wk=weekOfTerm(),N=mine('notes');
 return pairsOf(uid_).filter(p=>!N.some(n=>n.teacherId===uid_&&n.sessionId===ses.id&&tm&&n.term===tm.name&&n.week===wk&&n.classId===p.classId&&n.subjectId===p.subjectId&&n.status!=='draft'))}
const noteDeadline=()=>{const d=school().settings.noteDay;return addDays(mondayOf(TODAY()),d)};

function bars(data,{h=150,color='var(--blue)',max}={}){const m=max||Math.max(1,...data.map(d=>d.v)),w=Math.max(34,Math.min(60,560/data.length));
 return`<svg class="chart" viewBox="0 0 ${data.length*w} ${h+26}" role="img">`+data.map((d,i)=>{const bh=Math.round(d.v/m*h);return`<rect x="${i*w+w*.2}" y="${h-bh}" width="${w*.6}" height="${Math.max(bh,1)}" rx="4" style="fill:${d.c||color}"/><text x="${i*w+w/2}" y="${h+14}" text-anchor="middle" class="ct">${esc(d.l)}</text><text x="${i*w+w/2}" y="${h-bh-4}" text-anchor="middle" class="cv">${d.v}</text>`}).join('')+`</svg>`}
function lineChart(vals,labels,{h=140,color='var(--blue)',max=100}={}){const W=520,n=vals.length,px=i=>20+i*(W-40)/Math.max(1,n-1),py=v=>h-(v/max)*h+8;
 const pts=vals.map((v,i)=>`${px(i)},${py(v)}`).join(' ');
 return`<svg class="chart" viewBox="0 0 ${W} ${h+34}" role="img"><line x1="20" x2="${W-20}" y1="${py(max)}" y2="${py(max)}" stroke="var(--line)"/><line x1="20" x2="${W-20}" y1="${py(0)}" y2="${py(0)}" stroke="var(--line)"/><polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="2.5" stroke-linejoin="round"/>`+vals.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="3.5" style="fill:${color}"/>${n<=16?`<text x="${px(i)}" y="${h+26}" text-anchor="middle" class="ct">${esc(labels[i])}</text>`:''}`).join('')+`</svg>`}
function donut(parts){const tot=parts.reduce((a,p)=>a+p.v,0)||1;let acc=0;const R=42,C=2*Math.PI*R;
 return`<div class="row" style="gap:20px"><svg viewBox="0 0 110 110" width="132" height="132" role="img"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--line)" stroke-width="14"/>`+parts.map(p=>{const len=p.v/tot*C,s=`<circle cx="55" cy="55" r="${R}" fill="none" style="stroke:${p.c}" stroke-width="14" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 55 55)"/>`;acc+=len;return s}).join('')+`<text x="55" y="60" text-anchor="middle" style="font:600 18px var(--serif);fill:var(--text)">${tot}</text></svg><div class="legend" style="flex-direction:column;gap:6px;margin:0">${parts.map(p=>`<span><i style="background:${p.c}"></i>${esc(p.l)}: <b style="color:var(--text)">${p.v}</b></span>`).join('')}</div></div>`}
const meter=(v,cls='')=>`<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar ${cls} sp"><i style="width:${Math.min(100,v)}%"></i></div><span class="sm">${v}%</span></div>`;

function clockCard(){const u=S.user,a=attToday(u.id),sc=school().settings,today=TODAY();
 let status,b='';
 if(!a||!a.in){status='You have not clocked in today.';b=btn('Clock in','clockin','gold lg')}
 else if(!a.out){status=`Clocked in at ${a.in}. ${a.status==='late'?'Marked late.':'On time.'}`;b=btn('Clock out','clockout','dark lg')}
 else status=`Clocked in ${a.in}, clocked out ${a.out}${a.early?'. Marked early departure':''}.`;
 return`<section class="card clock"><div><div class="mut">${fmtDL(today)}</div><div class="bigtime" id="liveclock">${liveTime()}</div><div>${status}</div><div class="sm mut">School hours ${sc.resume} to ${sc.close}. ${sc.geofence?'Location check is on.':'Your location is recorded when you clock in.'}</div></div><div>${b}</div></section>`}
const liveTime=()=>{const d=new Date();return`${pad(d.getHours())}:${pad(d.getMinutes())}<sup>:${pad(d.getSeconds())}</sup>`};
const weekendNote=()=>isWeekend()?`<div class="card" style="border-color:var(--gold);background:var(--gold-soft)"><b>It's the weekend.</b> This demo uses ${fmtD(TODAY())} as the working day so every screen has live data.</div>`:'';
function ttGrid(slots,{showClass=true,showTeacher=false,showSubject=true}={}){
 const t=TODAY(),td=dow(t);let h=`<div class="tw"><div class="ttg"><div></div>${DAYS.map((d,i)=>`<div class="h ${i===td&&dow(t)<5?'today':''}">${d}</div>`).join('')}`;
 PERIODS.forEach(p=>{if(p.n===4)h+=`<div class="cell brk">Break 10:00 to 10:30</div>`;
  h+=`<div class="p">Period ${p.n}<br>${p.s}</div>`;
  for(let d=0;d<5;d++){const s=slots.find(x=>x.day===d&&x.period===p.n);
   h+=s?`<div class="cell has ${d===td?'today':''}"><b>${esc(showSubject?nm('subjects',s.subjectId):nm('classes',s.classId))}</b>${showSubject&&showClass?esc(nm('classes',s.classId)):''}${showTeacher?`<br><span class="mut">${esc(nm('users',s.teacherId))}</span>`:''}</div>`:`<div class="cell"></div>`}});
 return h+'</div></div>'}
function ttViews(slots,opt){const m=S.ttMode,today=TODAY();
 const tabs=`<div class="tabs">${['day','week','month'].map(x=>`<button class="${m===x?'on':''}" data-act="ttmode" data-m="${x}">${{day:'Daily',week:'Weekly',month:'Monthly'}[x]}</button>`).join('')}</div>`;
 if(m==='week')return tabs+ttGrid(slots,opt);
 if(m==='day'){const L=slots.filter(s=>s.day===dow(today)).sort((a,b)=>a.period-b.period);
  return tabs+`<p class="mut">${fmtDL(today)}</p><div class="list">${L.map(s=>{const p=PERIODS[s.period-1];return`<div class="item"><b style="width:96px">${p.s} to ${p.e}</b><div class="sp"><div class="t">${esc(nm('subjects',s.subjectId))}, ${esc(nm('classes',s.classId))}</div>${opt.showTeacher?`<div class="sm mut">${esc(nm('users',s.teacherId))}</div>`:''}</div></div>`}).join('')||empty('No lessons today')}</div>`}
 const first=today.slice(0,8)+'01',last=iso(new Date(parse(first).getFullYear(),parse(first).getMonth()+1,0)),lead=dow(first);
 let c=`<p class="mut">${['January','February','March','April','May','June','July','August','September','October','November','December'][parse(first).getMonth()]} ${parse(first).getFullYear()}</p><div class="tw"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dh">${d}</div>`).join('')}`;
 for(let i=0;i<lead;i++)c+='<div style="border:0"></div>';
 for(let d=first;d<=last;d=addDays(d,1)){const w=dow(d),n=w<5?slots.filter(s=>s.day===w).length:0;c+=`<div class="${n?'on':''} ${d===today?'tdy':''}"><b>${parse(d).getDate()}</b>${n?`<br>${n} lesson${n>1?'s':''}`:''}</div>`}
 return tabs+c+'</div></div>'}

async function aiGenerate(subject,cls,topic,extra){
 try{const c=new AbortController();setTimeout(()=>c.abort(),25000);
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
   system:'You help Nigerian secondary school teachers draft lesson notes. Reply with ONLY a JSON object with string keys objectives, intro, content, activities, evaluation, assignment, materials. Keep each value under 90 words. Use plain text, numbered lines separated by \\n where useful. No markdown fences.',
   messages:[{role:'user',content:`Subject: ${subject}. Class: ${cls}. Topic: ${topic}. ${extra||''}`}]})});
  if(!r.ok)throw 0;const d=await r.json(),t=d.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim(),o=JSON.parse(t);
  return{...scaffold(subject,cls,topic),...o,source:'ai'}}
 catch(e){return{...scaffold(subject,cls,topic),source:'template'}}}

const loadScript=u=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${u}"]`))return ok();const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
const fname=(s)=>s.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
function printHtml(title,inner){const w=window.open('','_blank');if(!w)return toast('This window cannot open a print page. Try the download buttons in a full browser tab.','bad');w.document.write(`<html><head><title>${esc(title)}</title><style>body{font:13px Arial;padding:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:5px;text-align:left}h1{font-size:18px}</style></head><body><h1>${esc(title)}</h1>${inner}</body></html>`);w.document.close();w.print()}
ACT.repXlsx=async()=>{const r=S.rep,R=RPT[r.key].f(r),name=`${fname(school().name)}-${r.key}-${r.to}`;
 try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([R.head,...R.rows]),'Report');XLSX.writeFile(wb,name+'.xlsx');toast('Excel file downloaded','ok')}
 catch(e){const csv='\ufeff'+[R.head,...R.rows].map(x=>x.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');dl(name+'.csv',new Blob([csv],{type:'text/csv'}));toast('Excel library unavailable, so a CSV file was downloaded. Excel opens it directly.')}};
ACT.repPdf=async()=>{const r=S.rep,R=RPT[r.key].f(r),title=`${school().name}: ${RPT[r.key].n}`;
 try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  const doc=new window.jspdf.jsPDF({orientation:R.head.length>6?'landscape':'portrait'});doc.setFontSize(14);doc.text(title,14,16);doc.setFontSize(9);doc.text(`${r.from} to ${r.to}. Generated ${new Date().toLocaleString()}`,14,22);
  doc.autoTable({head:[R.head],body:R.rows.map(x=>x.map(String)),startY:27,styles:{fontSize:8},headStyles:{fillColor:[5,5,6],textColor:[212,175,55]}});doc.save(fname(title)+'.pdf');toast('PDF downloaded','ok')}

const getPos=()=>new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{enableHighAccuracy:true,timeout:8000,maximumAge:30000})});
const hav=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180,x=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
A_('clockin',async()=>{const u=S.user,sc=school(),s=sc.settings,today=TODAY();if(attToday(u.id)&&attToday(u.id).in)return;toast('Checking your location…');
 const pos=await getPos();let loc='unverified';
 if(s.geofence&&s.lat!=null){if(!pos)return toast('This school needs your location to clock you in. Allow location access and try again.','bad');const dist=hav(pos.lat,pos.lng,s.lat,s.lng);if(dist>s.radius)return toast(`You are about ${Math.round(dist)} m from school. Clocking in works within ${s.radius} m.`,'bad');loc='inside'}
 else if(pos)loc='recorded';
 const t=nowHM(),late=toMin(t)>toMin(s.resume)+Number(s.grace);let rec=attToday(u.id);if(!rec){rec={id:uid(),school:sc.id,userId:u.id,date:today};DB.attendance.push(rec)}
 Object.assign(rec,{in:t,out:null,status:late?'late':'present',early:false,loc,lat:pos&&pos.lat,lng:pos&&pos.lng,corrected:false});
 if(late)notifyAdmins('Late arrival',`${u.name} clocked in at ${t}.`,'Alert');logAct(`${u.name} clocked in at ${t}`);persist();toast(late?`Clocked in at ${t}. You are marked late.`:`Clocked in at ${t}. Have a good day.`,'ok');render(true)});

 const doc=new window.jspdf.jsPDF({orientation:head.length>6?'landscape':'portrait'});doc.setFontSize(13);doc.text(title,14,16);doc.autoTable({head:[head],body:rows.map(r=>r.map(String)),startY:22,styles:{fontSize:8},headStyles:{fillColor:[5,5,6],textColor:[212,175,55]}});doc.save(fname(title)+'.pdf');toast('PDF downloaded','ok')}
 catch(e){printHtml(title,`<table><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`)}}
RPT.assess={n:'Assessment scores (CBT)',f:r=>({head:['Date','Class','Subject','Assessment','Student','Score','Out of','Percent'],rows:mine('attempts').filter(t=>t.status==='submitted'&&!t.voided&&iso(new Date(t.submittedAt))>=r.from&&iso(new Date(t.submittedAt))<=r.to).sort((a,b)=>a.submittedAt-b.submittedAt).map(t=>{const a=byId('assessments',t.assessmentId)||{};return[iso(new Date(t.submittedAt)),nm('classes',a.classId),nm('subjects',a.subjectId),a.title,nm('users',t.studentId),t.score,t.total,pct(t.score,t.total)]})})};

/* ---- backup and restore ---- */
const backupCard=()=>card('Back up your data',`<p class="mut">Download a copy of everything: staff, students, lesson notes, assessments and results. ${DB.lastBackup?'Last backup: '+fmtTs(DB.lastBackup)+'.':'You have not made a backup yet.'} Make one after each exam and each time results are published.</p><div class="row">${btn(ico('dl')+'Download backup','backup','gold')}<label class="btn" style="cursor:pointer">${ico('up')}Restore from a backup<input type="file" accept=".json,application/json" data-restore class="hide"></label></div><p class="sm mut">Keep backup files private. They hold everyone's details, with passwords scrambled.</p>`);
A_('backup',()=>{DB.lastBackup=Date.now();persist();dl(`eduvanta-backup-${iso(new Date())}.json`,new Blob([JSON.stringify(DB)],{type:'application/json'}));toast('Backup downloaded. Store it somewhere safe.','ok');render(true)});
A_('restoreDo',()=>{DB=S.restore;DB.session=null;S.user=null;S.restore=null;closeModal();persist();render();toast('Backup restored. Sign in again.','ok')});
FORMS.comps=d=>{const C=[0,1,2,3].map(i=>({key:'c'+(i+1),name:(d['n'+i]||'').trim(),max:Number(d['m'+i])})).filter(c=>c.name);if(!C.length||C.some(c=>!(c.max>0)))return toast('Give each column a name and a maximum above zero.','bad');school().settings.comps=C;persist();toast('Result structure saved','ok');render(true)};
const compsCard=()=>{const C=COMP();return card('Result structure',`<form data-form="comps"><p class="mut sm">The columns on every result sheet. Together they usually make 100. If you change this after scores are entered, percentages and grades are worked out again from the saved scores.</p>${[0,1,2,3].map(i=>`<div class="fgrid">${fld('Column '+(i+1),'n'+i,{value:C[i]?C[i].name:''})}${fld('Maximum','m'+i,{type:'number',value:C[i]?C[i].max:'',attr:'min="1" step="0.5"'})}</div>`).join('')}<button class="btn pri">Save structure</button></form>`)};

const cmtOf=(stu,ses,term)=>mine('comments').find(c=>c.studentId===stu&&c.sessionId===ses&&c.term===term)||{};
A_('cmtOpen',d=>{const c=cmtOf(d.id,d.s,d.t);modal(`Comments for ${esc(byId('users',d.id).name)}`,`<p class="mut sm">These appear on the report card.</p><form data-form="cmt" data-id="${d.id}" data-s="${d.s}" data-t="${d.t}">${fld('Class teacher comment','teacher',{type:'area',rows:3,value:c.teacher||''})}${fld('Principal comment','principal',{type:'area',rows:3,value:c.principal||''})}<div class="acts"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri">Save comments</button></div></form>`)});
FORMS.cmt=(d,f)=>{let c=mine('comments').find(x=>x.studentId===f.dataset.id&&x.sessionId===f.dataset.s&&x.term===f.dataset.t);if(!c){c={id:uid(),school:sid(),studentId:f.dataset.id,sessionId:f.dataset.s,term:f.dataset.t};DB.comments.push(c)}c.teacher=d.teacher;c.principal=d.principal;c.updatedAt=Date.now();closeModal();persist();toast('Comments saved','ok')};
const logoCard=()=>{const l=school().settings.logo;return card('School logo',`<div class="row">${l?`<img src="${l}" alt="" style="width:64px;height:64px;object-fit:contain;border-radius:10px;border:1px solid var(--line)">`:''}<label class="btn" style="cursor:pointer">${ico('up')}${l?'Change logo':'Upload logo'}<input type="file" accept="image/*" data-logo class="hide"></label>${l?btn('Remove','logoDel','sm bad'):''}</div><p class="sm mut">Shown on the sign-in page, in the sidebar and on report cards.</p>`)};
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.logo!==undefined&&t.files[0]){imgToData(t.files[0],240,'image/png').then(u=>{school().settings.logo=u;persist();render(true);toast('Logo saved','ok')}).catch(()=>toast('That picture could not be read.','bad'))}});
A_('logoDel',()=>{delete school().settings.logo;persist();render(true)});
A_('slotBulk',()=>modal('Import timetable lessons',`<p class="mut sm">One lesson per line: day, period (1 to 6), class, subject, teacher's email or full name. Lessons that clash are skipped and listed so you can fix them.</p><pre style="background:var(--bg);padding:10px;border-radius:8px;font-size:13px;white-space:pre-wrap">Monday, 1, SS1, Mathematics, chidi@school.com\nTuesday, 3, JSS2, English Language, Mrs Adeyemi</pre><form data-form="slotBulk">${fld('Lessons','list',{type:'area',rows:10,req:true})}<div class="acts"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn pri">Import</button></div></form>`,true));
FORMS.slotBulk=d=>{const T=teachers(true),C=mine('classes'),Sb=mine('subjects'),busy=new Set(mine('slots').flatMap(s=>['t'+s.teacherId+s.day+s.period,'c'+s.classId+s.day+s.period])),err=[],per={};let ok=0;const N=x=>x.toLowerCase().replace(/[^a-z0-9@.]/g,'');
 d.list.split('\n').map(l=>l.trim()).filter(Boolean).forEach((line,i)=>{const p=line.split(',').map(x=>x.trim()),bad=m=>err.push(`Line ${i+1}: ${m}`);if(p.length<5)return bad('needs day, period, class, subject and teacher');
  const day=DAYL.findIndex(x=>x.toLowerCase().startsWith(p[0].toLowerCase().slice(0,3))),per_=Number(p[1]),cl=C.find(c=>N(c.name)===N(p[2])),sb=Sb.find(x=>N(x.name)===N(p[3])),tq=N(p[4]),tm=T.filter(t=>N(t.email)===tq||N(t.name)===tq||N(t.name).includes(tq)&&tq.length>3);
  if(day<0)return bad(`"${p[0]}" is not a school day`);if(!(per_>=1&&per_<=6))return bad('period must be 1 to 6');if(!cl)return bad(`class "${p[2]}" not found`);if(!sb)return bad(`subject "${p[3]}" not found`);
  if(tm.length!==1)return bad(tm.length?`"${p[4]}" matches more than one teacher, use the email`:`teacher "${p[4]}" not found or not approved`);
  const t=tm[0],kt='t'+t.id+day+per_,kc='c'+cl.id+day+per_;if(busy.has(kt))return bad(`${t.name} already has a lesson on ${DAYL[day]}, period ${per_}`);if(busy.has(kc))return bad(`${cl.name} already has a lesson on ${DAYL[day]}, period ${per_}`);
  busy.add(kt);busy.add(kc);DB.slots.push({id:uid(),school:sid(),day,period:per_,classId:cl.id,subjectId:sb.id,teacherId:t.id});t.assign=t.assign||[];if(!t.assign.some(a=>a.classId===cl.id&&a.subjectId===sb.id))t.assign.push({classId:cl.id,subjectId:sb.id});per[t.id]=(per[t.id]||0)+1;ok++});
 Object.entries(per).forEach(([id,n])=>notify(id,'Timetable updated',`${n} lesson${n>1?'s were':' was'} added to your timetable.`,'Info'));persist();render(true);
 modal('Import finished',`<p><b>${ok}</b> lesson${ok===1?'':'s'} added.${err.length?` <b>${err.length}</b> skipped:`:''}</p>${err.length?`<ul class="sm">${err.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}<div class="acts"><button class="btn pri" data-act="close">Done</button></div>`)};
